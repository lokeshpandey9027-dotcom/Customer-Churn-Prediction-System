<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Intelligence - Secure Workspace</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons for Eye & Lock -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #4f46e5 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .portal-panel {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
            background: #ffffff;
            width: 100%;
            max-width: 450px;
            overflow: hidden;
        }
        .panel-header {
            padding: 2.5rem 2rem 1.25rem 2rem;
            text-align: center;
        }
        .brand-icon {
            width: 54px;
            height: 54px;
            background: #4f46e5;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            margin: 0 auto 1.25rem auto;
            font-weight: 700;
            font-size: 1.3rem;
            box-shadow: 0 10px 20px -3px rgba(79, 70, 229, 0.35);
        }
        .nav-pills {
            background: #f8fafc;
            padding: 0.4rem;
            border-radius: 0.75rem;
            border: 1px solid #e2e8f0;
        }
        .nav-pills .nav-link {
            border-radius: 0.5rem;
            font-weight: 600;
            font-size: 0.88rem;
            color: #475569;
            background: transparent;
            transition: all 0.2s ease;
            padding: 0.6rem 1rem;
        }
        .nav-pills .nav-link.active {
            background-color: #4f46e5 !important;
            color: #ffffff !important;
            box-shadow: 0 4px 8px -1px rgba(79, 70, 229, 0.25);
        }
        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 0.35rem;
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
        }
        .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        .password-container {
            position: relative;
        }
        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #64748b;
            font-size: 0.95rem;
        }
        .toggle-password:hover {
            color: #4f46e5;
        }
        .btn-portal {
            background-color: #4f46e5;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 0.5rem;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-portal:hover {
            background-color: #4338ca;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 6px 15px rgba(79, 70, 229, 0.3);
        }
        .btn-register {
            background-color: #10b981;
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 0.5rem;
            color: white;
            transition: all 0.2s ease;
        }
        .btn-register:hover {
            background-color: #059669;
            color: white;
            transform: translateY(-1px);
        }
        .panel-footer-text {
            background: #f8fafc;
            border-top: 1px solid #f1f5f9;
            padding: 1rem;
            text-align: center;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }
     body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(14, 165, 233, 0.35) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.25) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.3) 0px, transparent 50%);
            background-size: 200% 200%;
            animation: gradientAnimation 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
    </style>
</head>
<body>

    <div class="container px-3">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-6">
                <div class="card portal-panel">
                    
                    <!-- Panel Header / Branding -->
                    <div class="panel-header">
                        <div class="brand-icon">CP</div>
                        <h4 class="fw-bold text-dark mb-1" style="letter-spacing: -0.5px;">Customer Churn Intelligence</h4>
                        <p class="text-muted small mb-0" style="font-size: 0.8rem;">Secure Analytics & Behavioral Tracking Workspace</p>
                    </div>

                    <div class="card-body px-4 pb-4 pt-1">
                        <!-- Navigation Tabs (Sign In / Register New User) -->
                        <ul class="nav nav-pills nav-fill mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="login-tab" data-bs-toggle="pill" data-bs-target="#login-pane" type="button" role="tab" aria-controls="login-pane" aria-selected="true">🔐 Sign In</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="register-tab" data-bs-toggle="pill" data-bs-target="#register-pane" type="button" role="tab" aria-controls="register-pane" aria-selected="false">👤 New User Sign Up</button>
                            </li>
                        </ul>

                        <!-- Error Alert -->
                        {% if error %}
                        <div class="alert alert-danger alert-dismissible fade show py-2 small shadow-sm border-0 mb-3" role="alert">
                            {{ error }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}

                        <!-- Success Alert -->
                        {% if success %}
                        <div class="alert alert-success alert-dismissible fade show py-2 small shadow-sm border-0 mb-3" role="alert">
                            {{ success }}
                            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
                        </div>
                        {% endif %}

                        <div class="tab-content" id="authTabsContent">
                            <!-- SIGN IN PANE -->
                            <div class="tab-pane fade show active" id="login-pane" role="tabpanel" aria-labelledby="login-tab">
                                <form method="POST" action="/login" id="loginForm">
                                    <div class="mb-3">
                                        <label for="username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="password-container">
                                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                                            <i class="fa-regular fa-eye toggle-password" id="toggleLoginPassword"></i>
                                        </div>
                                    </div>
                                    <div class="d-flex justify-content-between align-items-center mb-4">
                                        <div class="form-check">
                                            <input type="checkbox" class="form-check-input" id="rememberMe">
                                            <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                                        </div>
                                        <a href="#" onclick="alert('Password reset link sent to registered email.'); return false;" class="small text-decoration-none text-indigo fw-semibold">Forgot Password?</a>
                                    </div>
                                    <button type="submit" class="btn btn-portal w-100 shadow-sm" id="loginBtn">Access Workspace</button>
                                </form>
                            </div>

                            <!-- NEW USER REGISTRATION PANE -->
                            <div class="tab-pane fade" id="register-pane" role="tabpanel" aria-labelledby="register-tab">
                                <form method="POST" action="/register" id="registerForm">
                                    <div class="mb-3">
                                        <label for="reg_username" class="form-label">Username</label>
                                        <input type="text" class="form-control" id="reg_username" name="reg_username" placeholder="Choose a username" required>
                                    </div>
                                    <div class="mb-3">
                                        <label for="reg_email" class="form-label">Email Address</label>
                                        <input type="email" class="form-control" id="reg_email" name="reg_email" placeholder="name@company.com" required>
                                    </div>
                                    <div class="mb-4">
                                        <label for="reg_password" class="form-label">Password</label>
                                        <div class="password-container">
                                            <input type="password" class="form-control" id="reg_password" name="reg_password" placeholder="Create a strong password" required>
                                            <i class="fa-regular fa-eye toggle-password" id="toggleRegPassword"></i>
                                        </div>
                                    </div>
                                    <button type="submit" class="btn btn-register w-100 shadow-sm" id="regBtn">Create Account</button>
                                </form>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Footer -->
                    <div class="panel-footer-text">
                        Powered by FastAPI, SQLAlchemy & Machine Learning
                    </div>

                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript for Password Toggle & Loading Effect -->
    <script>
        // Toggle Login Password
        const toggleLoginPassword = document.getElementById('toggleLoginPassword');
        const loginPassword = document.getElementById('password');
        toggleLoginPassword.addEventListener('click', function () {
            const type = loginPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            loginPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Toggle Register Password
        const toggleRegPassword = document.getElementById('toggleRegPassword');
        const regPassword = document.getElementById('reg_password');
        toggleRegPassword.addEventListener('click', function () {
            const type = regPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            regPassword.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });

        // Loading state on form submit
        document.getElementById('loginForm').addEventListener('submit', function() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';
            btn.disabled = true;
        });

        document.getElementById('registerForm').addEventListener('submit', function() {
            const btn = document.getElementById('regBtn');
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...';
            btn.disabled = true;
        });
    </script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
